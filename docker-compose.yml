services:
  postgres:
    image: postgres:16-alpine
    container_name: autojob_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: autojob
      POSTGRES_USER: autojob
      POSTGRES_PASSWORD: autojob_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autojob"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autojob_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
